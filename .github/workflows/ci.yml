name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu --extra templates --extra pdf
      - name: Ruff (lint)
        run: uv run ruff check --output-format=github src tests
      - name: Ruff (format)
        run: uv run ruff format --check src tests
      - name: Mypy (strict)
        run: uv run mypy src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra cpu --extra templates --extra pdf
      - name: "Tests (offline: RapidOCR models ship in the wheel)"
        run: uv run pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      # `cpu` and `directml` are mutually exclusive extras, so audit each
      # resolution separately (--all-extras would violate the declared conflict).
      - name: Audit dependencies for known vulnerabilities
        run: |
          common="--extra trocr --extra ui --extra templates --extra pdf"
          for backend in cpu directml; do
            uv export --frozen --no-hashes --no-emit-project --no-group dev \
              --extra "$backend" $common -o "requirements-audit-$backend.txt"
            # The export is fully pinned, so --no-deps audits exactly the lockfile.
            uvx pip-audit --strict --disable-pip --no-deps -r "requirements-audit-$backend.txt"
          done
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Block images/PDFs outside allowed folders
        run: python scripts/check_sensitive_files.py $(git ls-files)
